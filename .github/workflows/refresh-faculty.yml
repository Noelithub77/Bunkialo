name: Refresh Faculty and Hostel Wardens

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:

concurrency:
  group: refresh-faculty-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          # On protected main, use a token whose actor may push directly.
          token: ${{ secrets.FACULTY_UPDATE_TOKEN || github.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install scraper browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Refresh official faculty and hostel data
        run: pnpm run fetch-faculty

      - name: Validate generated data
        run: |
          pnpm run typecheck
          pnpm exec vitest run tests/unit/faculty-hostels.test.ts

      - name: Commit updated data to main
        run: |
          if git diff --quiet -- src/data/faculty.ts src/data/hostels.ts; then
            echo "Official directory is unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/faculty.ts src/data/hostels.ts
          git commit -m "data: refresh official faculty and hostel wardens"
          git pull --rebase origin main
          if ! git push origin HEAD:main; then
            echo "::error::Direct push rejected. Set FACULTY_UPDATE_TOKEN to a token allowed to push to protected main."
            exit 1
          fi

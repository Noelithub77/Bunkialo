name: Full Update (Build + Publish)

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Restore Gradle cache
        id: cache-gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-${{ runner.arch }}-gradle-v1-${{ hashFiles('pnpm-lock.yaml', 'package.json', 'eas.json', 'scripts/actions/configure-gradle-properties.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-gradle-v1-

      - name: Restore pnpm store cache
        id: cache-pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-12.16.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-12.16.1-

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        env:
          PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest
          packager: pnpm
          eas-cache: true

      - name: Setup EAS local builds
        run: pnpm add -g eas-cli-local-build-plugin

      - name: Clean build outputs only
        run: rm -rf node_modules "${RUNNER_TEMP}/eas-local-build" "${RUNNER_TEMP}/artifacts"

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Configure global Gradle properties
        run: bash scripts/actions/configure-gradle-properties.sh

      - name: Build Android (production)
        run: bash scripts/actions/build-android-production.sh
        env:
          EAS_LOCAL_BUILD_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
          EAS_LOCAL_BUILD_WORKINGDIR: ${{ runner.temp }}/eas-local-build
          EAS_LOCAL_BUILD_SKIP_CLEANUP: "1"

      - name: Upload production AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-production-aab
          path: ${{ runner.temp }}/artifacts/app-production.aab
          if-no-files-found: error
          retention-days: 7

  github-release:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: build-android
    permissions:
      contents: write
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        env:
          PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest
          packager: pnpm
          eas-cache: true

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download production AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-production-aab
          path: ${{ runner.temp }}/artifacts

      - name: Resolve app version
        id: versions
        run: bash scripts/actions/resolve-app-versions.sh

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.versions.outputs.package_version }}${{ steps.versions.outputs.version_code && format('({0})', steps.versions.outputs.version_code) || '' }}
          name: v${{ steps.versions.outputs.package_version }}${{ steps.versions.outputs.version_code && format(' ({0})', steps.versions.outputs.version_code) || '' }}
          body_path: releases/v${{ steps.versions.outputs.package_version }}.md
          files: ${{ runner.temp }}/artifacts/app-production.aab

  publish-google-play:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: github-release
    permissions:
      contents: read
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        env:
          PNPM_CONFIG_STRICT_DEP_BUILDS: "false"
        with:
          token: ${{ secrets.EXPO_TOKEN }}
          expo-version: latest
          eas-version: latest
          packager: pnpm
          eas-cache: true

      - name: Restore pnpm store cache
        id: cache-pnpm
        uses: actions/cache@v4
        with:
          path: |
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-${{ runner.arch }}-pnpm-12.16.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pnpm-12.16.1-

      - name: Restore node_modules cache
        id: cache-node-modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-${{ hashFiles('pnpm-lock.yaml', 'patches/**') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-modules-pnpm-12.16.1-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile

      - name: Download production AAB artifact
        uses: actions/download-artifact@v4
        with:
          name: android-production-aab
          path: ${{ runner.temp }}/artifacts

      - name: Submit to Google Play (production)
        run: bash scripts/actions/submit-android-production.sh
        env:
          ANDROID_ARTIFACT_PATH: ${{ runner.temp }}/artifacts/app-production.aab

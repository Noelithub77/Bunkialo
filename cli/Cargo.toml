[package]
name = "bunkialo-cli"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "bunkialo"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
html-escape = "0.2"
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }
mime_guess = "2"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "cookies", "multipart", "json"] }
rpassword = "7"
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tiny_http = "0.12"
rand = "0.8"
webbrowser = "1"
